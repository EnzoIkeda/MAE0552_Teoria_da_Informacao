[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mae0552-teoria-da-informacao"
version = "0.1.0"
description = "Simulacoes da disciplina de Teoria da Informacao (MAE0552)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jupyterlab>=4.0",
    "pre-commit>=3.5",
    "ruff>=0.6",
    "nbmake>=1.5",
    "ipykernel>=6.29",
]

# Apenas o pacote compartilhado `utils` e instalavel/importavel em qualquer
# lugar do repositorio. O codigo especifico de cada topico vive no `src/` do
# proprio topico e e importado a partir do diretorio do notebook.
[tool.setuptools]
packages = ["utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
